<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lume y la luna</title>
<style>
:root{
  --bg:#e6f5ff;--card:#ffffff;--text:#2d2a4a;--soft:#d5ecff;
  --yellow:#ffc83d;--green:#5fd38d;--coral:#ff7a8a;--purple:#a58bff;--blue:#4aa3ff;
  --ok:#2e9e5b;--bad:#e8832a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2540;--card:#2b3257;--text:#f6f1e6;--soft:#343c68;--ok:#6fdc9a;--bad:#ffb066}}
:root[data-theme="dark"]{--bg:#1f2540;--card:#2b3257;--text:#f6f1e6;--soft:#343c68;--ok:#6fdc9a;--bad:#ffb066}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--text);font-family:"Verdana","Trebuchet MS",Arial,sans-serif;font-size:18px;line-height:1.6;letter-spacing:.03em}
main{max-width:560px;margin:0 auto}
header{text-align:center;background:linear-gradient(135deg,var(--yellow),var(--coral));color:#2d2a4a;border-radius:24px;padding:14px 16px;margin-bottom:6px}
h1{margin:0;font-size:28px}
header p{margin:4px 0 0;font-size:16px}
h2{font-size:21px;margin:22px 0 10px}
.row{display:flex;gap:8px;margin-bottom:10px}
.num{flex:0 0 40px;border-radius:50%;width:40px;height:40px;align-self:center;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#2d2a4a;background:var(--yellow)}
.card{flex:1;display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;letter-spacing:inherit;color:var(--text);cursor:pointer;
  background:color-mix(in srgb,var(--c) 24%,var(--card));border:4px solid var(--c);border-radius:20px;padding:8px;min-height:84px}
.card svg{flex:0 0 104px;width:104px;height:auto;border-radius:12px}
.txt{flex:1;font-size:16px;line-height:1.5}
.spk{font-size:24px;padding:4px}
.card.ok{border-color:var(--ok)}
.card.bad{border-color:var(--bad);border-style:dashed}
.empty{flex:1;min-height:84px;border:4px dashed var(--purple);border-radius:20px;display:flex;align-items:center;padding-left:16px;opacity:.7;font-size:16px}
#pool{display:flex;flex-direction:column;gap:10px}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:14px;border:0;border-radius:18px;font:inherit;font-weight:bold;color:#2d2a4a;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.check{background:var(--green)}
.btn.reset{background:var(--blue);color:#fff}
.btn:active{transform:translateY(3px);box-shadow:none}
#msg{display:none;margin-top:14px;padding:12px 14px;border-radius:18px;font-weight:bold;background:var(--soft);border:3px solid var(--purple)}
#msg.show{display:block}
#gallery{margin-top:10px;padding:6px 14px 16px;border-radius:24px;background:var(--soft)}
.link{font:inherit;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0}
.car{display:flex;align-items:center;gap:6px}
.car figure{flex:1;margin:0;background:var(--card);border:4px solid var(--purple);border-radius:22px;padding:8px;touch-action:pan-y}
#slide svg{width:100%;height:auto;border-radius:14px;display:block}
figcaption{padding:10px 6px 4px;font-size:18px;line-height:1.6;text-align:center}
.arrow{flex:0 0 44px;height:44px;border:0;border-radius:50%;background:var(--purple);color:#fff;font-size:18px;cursor:pointer}
#dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
#dots button{width:16px;height:16px;border-radius:50%;border:0;background:var(--card);cursor:pointer;padding:0}
#dots button.on{background:var(--coral);transform:scale(1.3)}
button:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes fl{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.tw{animation:tw 3s ease-in-out infinite}.fl{animation:fl 5s ease-in-out infinite}
#slide svg{animation:pop .4s ease}
.card{transition:transform .15s}.card:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <h1>🦊 Lume y la luna</h1>
  <p>Toca las páginas para ponerlas en orden. Toca 🔊 para escucharlas.</p>
</header>

<section>
  <h2>📖 Tu cuento</h2>
  <div id="slots"></div>
</section>

<section>
  <h2>🧩 Páginas desordenadas</h2>
  <div id="pool"></div>
</section>

<div class="btns">
  <button class="btn check" id="check">✔ Comprobar</button>
  <button class="btn reset" id="reset">🔀 Mezclar</button>
</div>
<div id="msg" role="status" aria-live="polite"></div>

<section id="gallery">
  <h2>🖼️ Galería del cuento</h2>
  <p id="lock">🔒 Ordena el cuento para ver las imágenes. <button class="link" id="unlock">Ver ahora</button></p>
  <div id="carWrap" hidden>
    <div class="car">
      <button class="arrow" id="prev" aria-label="Imagen anterior">◀</button>
      <figure>
        <div id="slide"></div>
        <figcaption id="cap"></figcaption>
      </figure>
      <button class="arrow" id="next" aria-label="Imagen siguiente">▶</button>
    </div>
    <div id="dots"></div>
  </div>
</section>
</main>
<script>
// ---------- Datos del cuento (orden correcto) ----------
const TEXTS=[
"Lume era un zorro pequeño que vivía en el bosque.",
"Una noche, vio que la luna no brillaba en el cielo.",
"Lume se preocupó y decidió ir a buscarla.",
"Primero encontró a un búho y le preguntó por la luna.",
"El búho le dijo que preguntara a la liebre del río.",
"Lume cruzó el río saltando sobre las piedras.",
"La liebre le contó que una nube grande tapaba la luna.",
"Lume pidió ayuda al viento para mover la nube.",
"El viento sopló fuerte y la nube se fue.",
"La luna brilló de nuevo y Lume durmió feliz."
];
const COLORS=["#ffcf5c","#6fd6a0","#ff8fa0","#b39dff","#5fb0ff"];

// ---------- Ilustraciones SVG ----------
const defs='<defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#e9f8ff"/></linearGradient><linearGradient id="gn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2a5c"/><stop offset="1" stop-color="#5a5aa8"/></linearGradient></defs>';
const sky=n=>`<rect width="200" height="120" fill="url(#${n?"gn":"gd"})"/>`;
const hills=n=>`<path d="M0 88q35-22 75-6t80-10q25-6 45 6v42H0z" fill="${n?"#3d7f6b":"#a4e6ac"}"/><path d="M0 100q40-14 90-4t110-6v30H0z" fill="${n?"#2f6c5b":"#74cf90"}"/>`;
const stars='<g fill="#fff6b0" class="tw"><circle cx="20" cy="15" r="1.6"/><circle cx="60" cy="30" r="1.2"/><circle cx="110" cy="12" r="1.6"/><circle cx="150" cy="26" r="1.3"/><circle cx="185" cy="14" r="1.6"/><circle cx="90" cy="42" r="1.1"/><circle cx="35" cy="38" r="1"/></g>';
const flies='<g fill="#fff59a" class="fl"><circle cx="40" cy="70" r="1.8"/><circle cx="168" cy="64" r="1.8"/><circle cx="24" cy="50" r="1.4"/><circle cx="125" cy="72" r="1.4"/></g>';
const fl=(x,y,c)=>`<path d="M${x} ${y}v-7" stroke="#4fae6c" stroke-width="1.5"/><circle cx="${x}" cy="${y-8}" r="3.2" fill="${c}"/><circle cx="${x}" cy="${y-8}" r="1.2" fill="#ffd84d"/>`;
const flowers=fl(16,113,"#ff9fb5")+fl(78,114,"#fff3b0")+fl(134,113,"#ffffff")+fl(186,112,"#ff9fb5");
const mush=(x,y)=>`<path d="M${x-7} ${y}a7 6 0 0 1 14 0z" fill="#ff8fa0"/><circle cx="${x-2}" cy="${y-3}" r="1.2" fill="#fff"/><circle cx="${x+3}" cy="${y-2}" r="1" fill="#fff"/><rect x="${x-2}" y="${y}" width="4" height="5" rx="1" fill="#fff4e0"/>`;
const tree=(x,n)=>{const c=n?["#2f7d63","#2a6e58","#378a6d"]:["#47b878","#3fae6a","#52c283"];return `<rect x="${x-3}" y="70" width="6" height="32" rx="2" fill="#8a5a3c"/><circle cx="${x}" cy="62" r="16" fill="${c[0]}"/><circle cx="${x-9}" cy="69" r="10" fill="${c[1]}"/><circle cx="${x+9}" cy="68" r="11" fill="${c[2]}"/>`;};
const moon=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r+9}" fill="#fff6b0" opacity=".18"/><circle cx="${x}" cy="${y}" r="${r+4}" fill="#fff6b0" opacity=".3"/><circle cx="${x}" cy="${y}" r="${r}" fill="#fff2a0"/><circle cx="${x-r*.3}" cy="${y-r*.2}" r="${r*.22}" fill="#f1dc82"/><circle cx="${x+r*.35}" cy="${y+r*.3}" r="${r*.16}" fill="#f1dc82"/>`;
const cloud=(x,y,c)=>`<g fill="${c||"#d5dcf0"}"><ellipse cx="${x}" cy="${y}" rx="26" ry="12"/><ellipse cx="${x-14}" cy="${y+3}" rx="16" ry="9"/><ellipse cx="${x+16}" cy="${y+3}" rx="18" ry="9"/></g>`;
const wind=(x,y)=>`<g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"><path d="M${x} ${y}h40q10 0 10-8q-1-6-7-4"/><path d="M${x+8} ${y+12}h46q10 0 10 8"/></g><g fill="#9be3a5"><ellipse cx="${x+60}" cy="${y-6}" rx="4" ry="2" transform="rotate(30 ${x+60} ${y-6})"/><ellipse cx="${x+75}" cy="${y+10}" rx="4" ry="2" transform="rotate(-20 ${x+75} ${y+10})"/></g>`;
const fox=(x,y)=>`<g transform="translate(${x} ${y})"><path d="M14 10q24-8 22 8q-10-3-22-2z" fill="#f28c38"/><path d="M28 13q8 0 8 5q-5-1-9-1z" fill="#fff"/><ellipse cy="12" rx="16" ry="10" fill="#f28c38"/><rect x="-10" y="19" width="6" height="5" rx="2.5" fill="#8a4f26"/><rect x="4" y="19" width="6" height="5" rx="2.5" fill="#8a4f26"/><circle cy="-4" r="11" fill="#f28c38"/><path d="M-10-10l-2-12 9 6zM10-10l2-12-9 6z" fill="#f28c38"/><path d="M-9-12l-1-6 5 3zM9-12l1-6-5 3z" fill="#ffb3a0"/><path d="M-8 0q8 10 16 0q-8-3-16 0z" fill="#fff"/><circle cx="-4" cy="-5" r="1.7" fill="#222"/><circle cx="4" cy="-5" r="1.7" fill="#222"/><circle cx="-3.5" cy="-5.6" r=".6" fill="#fff"/><circle cx="4.5" cy="-5.6" r=".6" fill="#fff"/><circle cx="-8" cy="-1" r="2" fill="#ff9fb5" opacity=".7"/><circle cx="8" cy="-1" r="2" fill="#ff9fb5" opacity=".7"/><circle cy="0" r="1.5" fill="#222"/></g>`;
const foxZ=()=>`<g transform="translate(100 96)"><path d="M20-2q18 0 15 11q-10 3-22-1z" fill="#f28c38"/><path d="M30 6q6 0 5 4q-4 1-8 0z" fill="#fff"/><ellipse rx="26" ry="11" fill="#f28c38"/><circle cx="-20" cy="-2" r="10" fill="#f28c38"/><path d="M-27-8l-2-9 8 4zM-14-9l1-9 6 6z" fill="#f28c38"/><path d="M-25 1q2 2 4 0M-18 1q2 2 4 0" stroke="#222" stroke-width="1.2" fill="none"/><circle cx="-24" cy="4" r="2" fill="#ff9fb5" opacity=".7"/><circle cx="-27" cy="3" r="1.3" fill="#222"/></g>`;
const owl=(x,y)=>`<g transform="translate(${x} ${y})"><rect x="-20" y="13" width="40" height="4" rx="2" fill="#8a5a3c"/><ellipse rx="13" ry="16" fill="#a8785a"/><ellipse cy="5" rx="8" ry="10" fill="#ecd0ae"/><path d="M-11-12l-2-8 8 4zM11-12l2-8-8 4z" fill="#a8785a"/><circle cx="-5" cy="-5" r="5.5" fill="#fff"/><circle cx="5" cy="-5" r="5.5" fill="#fff"/><circle cx="-5" cy="-5" r="2.4" fill="#222"/><circle cx="5" cy="-5" r="2.4" fill="#222"/><circle cx="-4.4" cy="-5.8" r=".8" fill="#fff"/><circle cx="5.6" cy="-5.8" r=".8" fill="#fff"/><path d="M-2 0h4l-2 5z" fill="#ffc83d"/></g>`;
const hare=(x,y)=>`<g transform="translate(${x} ${y})"><ellipse cy="9" rx="13" ry="10" fill="#efeaf7"/><circle cy="-6" r="9" fill="#efeaf7"/><ellipse cx="-4" cy="-22" rx="3" ry="10" fill="#efeaf7"/><ellipse cx="4" cy="-22" rx="3" ry="10" fill="#efeaf7"/><ellipse cx="-4" cy="-22" rx="1.4" ry="7" fill="#ffb3c6"/><ellipse cx="4" cy="-22" rx="1.4" ry="7" fill="#ffb3c6"/><circle cx="-3" cy="-7" r="1.5" fill="#222"/><circle cx="3" cy="-7" r="1.5" fill="#222"/><circle cx="-6" cy="-3" r="1.8" fill="#ffb3c6" opacity=".8"/><circle cx="6" cy="-3" r="1.8" fill="#ffb3c6" opacity=".8"/><circle cy="-3" r="1.6" fill="#ff7a8a"/><circle cx="13" cy="12" r="3.5" fill="#fff"/></g>`;
const txt=(x,y,s,t,f)=>`<text x="${x}" y="${y}" font-size="${s}" fill="${f||"#fff"}" font-family="Verdana,sans-serif" font-weight="bold">${t}</text>`;
const bub=(x,y,inner)=>`<ellipse cx="${x}" cy="${y}" rx="18" ry="14" fill="#fff"/><path d="M${x-12} ${y+10}l-8 10l16-6z" fill="#fff"/>${inner}`;
const N=g=>sky(1)+stars+g;
const SCENES=[
 sky(0)+'<circle cx="168" cy="24" r="17" fill="#ffe08a" opacity=".5"/><circle cx="168" cy="24" r="11" fill="#ffd84d"/>'+cloud(48,24,"#fff")+cloud(120,40,"#fff")+hills(0)+tree(28)+tree(176)+flowers+mush(58,109)+fox(100,85),
 N('<circle cx="150" cy="32" r="14" fill="none" stroke="#fff6b0" stroke-dasharray="3 4" opacity=".6"/>'+hills(1)+tree(30,1)+flowers+flies+fox(100,85)),
 N(hills(1)+tree(170,1)+flowers+fox(80,85)+bub(114,48,txt(108,56,20,"?","#5a5aa8"))),
 N(hills(1)+tree(158,1)+owl(158,50)+flowers+flies+fox(60,85)),
 N(hills(1)+tree(160,1)+owl(160,52)+flowers+fox(60,85)+bub(104,30,'<text x="94" y="37" font-size="18">🐇</text>')),
 N(hills(1)+'<rect y="88" width="200" height="32" fill="#4aa3ff"/><path d="M15 100q5-3 10 0M120 106q5-3 10 0M165 96q5-3 10 0" stroke="#bfe3ff" fill="none" stroke-width="1.5"/><g fill="#aab4c8"><ellipse cx="55" cy="99" rx="10" ry="5"/><ellipse cx="100" cy="99" rx="10" ry="5"/><ellipse cx="145" cy="99" rx="10" ry="5"/></g><ellipse cx="30" cy="110" rx="8" ry="3" fill="#4fae6c"/><ellipse cx="178" cy="108" rx="8" ry="3" fill="#4fae6c"/>'+flies+fox(100,62)),
 N(moon(150,30,13)+cloud(150,32,"#aeb6d6")+hills(1)+flowers+hare(150,83)+fox(60,85)),
 N(cloud(125,32)+cloud(60,22,"#bcc4e0")+wind(10,55)+hills(1)+tree(176,1)+flowers+fox(70,85)),
 N(moon(130,35,14)+cloud(185,28,"#aab3cc")+wind(10,40)+hills(1)+flowers+fox(70,85)),
 N(moon(100,36,20)+hills(1)+tree(24,1)+tree(178,1)+flowers+flies+foxZ()+txt(122,72,15,"z")+txt(134,62,12,"z")+txt(143,54,9,"z"))
];
const svg=i=>`<svg viewBox="0 0 200 120" role="img" aria-label="Ilustración: ${TEXTS[i]}">${defs}${SCENES[i]}</svg>`;

// ---------- Juego ----------
const $=id=>document.getElementById(id);
let pool,slots,checked;
function shuffle(){
  let a=TEXTS.map((_,i)=>i);
  do{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
  while(a.every((v,i)=>v===i));
  pool=a;slots=Array(10).fill(null);checked=false;msg("");render();
}
function say(i,e){
  e.stopPropagation();
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(TEXTS[i]);u.lang="es-ES";u.rate=.85;speechSynthesis.speak(u);}catch(_){}
}
function card(i,cls,mark){
  return `<button class="card ${cls||""}" data-i="${i}" style="--c:${COLORS[i%5]}">${svg(i)}<span class="txt">${mark||""}${TEXTS[i]}</span><span class="spk" role="button" aria-label="Escuchar" data-say="${i}">🔊</span></button>`;
}
function render(){
  $("slots").innerHTML=slots.map((v,n)=>{
    let cls="",mark="";
    if(checked&&v!==null){cls=v===n?"ok":"bad";mark=v===n?"✅ ":"🔸 ";}
    return `<div class="row"><div class="num">${n+1}</div>${v===null?`<div class="empty">Pon aquí la página ${n+1}</div>`:card(v,cls,mark)}</div>`;
  }).join("");
  $("pool").innerHTML=pool.map(i=>card(i)).join("");
  document.querySelectorAll("#slots .card").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;slots[slots.indexOf(i)]=null;pool.push(i);checked=false;msg("");render();});
  document.querySelectorAll("#pool .card").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,n=slots.indexOf(null);if(n<0)return;slots[n]=i;pool=pool.filter(x=>x!==i);checked=false;msg("");render();});
  document.querySelectorAll("[data-say]").forEach(s=>s.onclick=e=>say(+s.dataset.say,e));
}
function msg(t){const m=$("msg");m.textContent=t;m.className=t?"show":"";}
$("check").onclick=()=>{
  if(slots.includes(null)){msg("Aún quedan páginas por colocar. ¡Tú puedes! 💪");return;}
  checked=true;render();
  const good=slots.filter((v,n)=>v===n).length;
  if(good===10){msg("🎉 ¡Genial! Has ordenado todo el cuento. ¡Mira la galería!");openGallery(true);}
  else msg(`⭐ Tienes ${good} de 10 bien. Toca las páginas con 🔸 para moverlas.`);
};
$("reset").onclick=shuffle;

// ---------- Carrusel ----------
let cur=0;
function openGallery(scroll){
  $("lock").hidden=true;$("carWrap").hidden=false;show(0);
  if(scroll)$("gallery").scrollIntoView({behavior:"smooth"});
}
function show(n){
  cur=(n+10)%10;
  $("slide").innerHTML=svg(cur);
  $("cap").textContent=`${cur+1}. ${TEXTS[cur]}`;
  $("dots").innerHTML=TEXTS.map((_,i)=>`<button class="${i===cur?"on":""}" aria-label="Imagen ${i+1}" data-d="${i}"></button>`).join("");
  document.querySelectorAll("[data-d]").forEach(d=>d.onclick=()=>show(+d.dataset.d));
}
$("prev").onclick=()=>show(cur-1);
$("next").onclick=()=>show(cur+1);
$("unlock").onclick=()=>openGallery(false);
let x0=null;const fig=document.querySelector("figure");
fig.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true});
fig.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)show(cur+(dx<0?1:-1));x0=null;});

shuffle();
</script>
</body>
</html>
